
name: Recovery Build (Legacy)

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_URL (direct link to stock recovery/vendor boot image)'
        required: true
        default: 'https://github.com'
      MANIFEST_URL:
        description: 'MANIFEST_URL (for SSH use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-8.1'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.repository_owner == github.actor
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Image URL: ${{ github.event.inputs.IMG_URL }}"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      # Check out the repository
      - name: Check Out
        uses: actions/checkout@v3

      # Clean up the GitHub Actions workspace
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      # Install build dependencies
      - name: Prepare the environment
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gperf \
            gcc-multilib \
            gcc-10-multilib \
            g++-multilib \
            g++-10-multilib \
            libc6-dev \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5-dev \
            libsdl1.2-dev \
            libwxgtk3.0-gtk3-dev \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libstdc++-10-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            cpio \
            wget \
            curl \
            git \
            unzip \
            zip

          python3 -m pip install --user --upgrade twrpdtgen

      # Install Java 8
      - name: Install OpenJDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'

      # Configure SSH access for private manifests
      - name: Setup SSH Keys
        if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Install Google's repo tool
      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo

      # Initialize the Android source tree
      - name: Initialize repo
        id: pwd
        run: |
          mkdir -p workspace
          cd workspace

          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"

          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"

          repo init \
            --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"
        working-directory: ${{ github.workspace }}

      # Detect the appropriate device-tree dependency format
      - name: Check Build Tree
        uses: haya14busa/action-cond@v1
        id: buildtree
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: twrp
          if_false: omni

      # Download Android source code
      - name: Repo Sync
        run: |
          repo sync -j"$(nproc --all)" --force-sync
        working-directory: workspace

      # Generate the device tree from the supplied image
      - name: Generate Device Tree
        id: gdt
        run: |
          wget -O input.img "${{ github.event.inputs.IMG_URL }}"

          python3 "${GITHUB_WORKSPACE}/scripts/build.py" \
            -i input.img \
            -o device
        working-directory: workspace

      # Sync device-specific dependencies
      - name: Sync Device Dependencies
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/convert.sh" \
            "${{ steps.gdt.outputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"

          repo sync -j"$(nproc --all)"
        working-directory: workspace
        continue-on-error: true

      # Add swap space for memory-intensive builds
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # Attempt to enable Python 2 for legacy build scripts
      - name: Switch to Python2
        run: |
          if command -v python2 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python2)" /usr/local/bin/python
            python --version
          else
            echo "Python 2 is not installed; leaving the system Python unchanged."
            echo "If this legacy source requires Python 2, additional setup is needed."
          fi
        continue-on-error: true

      # Build the recovery image
      - name: Building recovery
        run: |
          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${{ steps.gdt.outputs.MAKEFILE_NAME }}-eng"

          make clean

          make "${{ github.event.inputs.BUILD_TARGET }}image" \
            -j"$(nproc --all)"
        working-directory: workspace

      # Upload generated files to GitHub Releases
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/*vendor*.img
          name: ${{ steps.gdt.outputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ steps.gdt.outputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
